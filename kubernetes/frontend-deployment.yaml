apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudbite-frontend
  namespace: cloudbite
  labels:
    app.kubernetes.io/name: cloudbite-frontend
    app.kubernetes.io/part-of: cloudbite
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudbite-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudbite-frontend
        app.kubernetes.io/part-of: cloudbite
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: cloudbite-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
