apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cloudbite-postgres
  namespace: cloudbite
spec:
  serviceName: cloudbite-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudbite-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudbite-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: cloudbite
            - name: POSTGRES_USER
              value: cloudbite
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudbite-secrets
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "cloudbite", "-d", "cloudbite"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
